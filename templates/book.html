{% extends 'base.html' %}{% block content %}<section class="form-page"><p class="eyebrow">YOUR NEXT STEP</p><h1>Request an appointment.</h1><p class="muted">Share your contact details and preferred time. The practice will contact you to discuss availability. Please do not include clinical information.</p><form method="post" class="panel form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="full_name" autocomplete="name" required maxlength="120" value="{{ values.get('full_name','') }}"></label><label>Email address<input type="email" name="email" autocomplete="email" required maxlength="254" value="{{ values.get('email','') }}"></label><label>Phone number<input type="tel" name="phone" autocomplete="tel" required maxlength="40" value="{{ values.get('phone','') }}"></label><label>Service<select name="service_type" required><option value="">Choose a service</option>{% for service in services %}<option {% if values.get('service_type')==service %}selected{% endif %}>{{ service }}</option>{% endfor %}</select></label><label class="full">Preferred date and time · Johannesburg<input type="datetime-local" name="preferred_at" required value="{{ values.get('preferred_at','') }}"></label><label class="checkbox full"><input type="checkbox" name="consent" required>I agree to the practice using these contact details to respond to this request. <a href="{{ url_for('med.governance') }}">Read the privacy information.</a></label><div class="full"><button class="button">Send request ↗</button></div></form></section>{% endblock %}
